function tcSyncFromDOM(){
  if(!tcCurrentRecord) return;
  const r = tcCurrentRecord;
  const g = id => document.getElementById(id);
  if(g('tc_fullName')) r.teacher.fullName = g('tc_fullName').value;
  if(g('tc_tscNumber')) r.teacher.tscNumber = g('tc_tscNumber').value;
  if(g('tc_idPassport')) r.teacher.idPassport = g('tc_idPassport').value;
  if(g('tc_designation')) r.teacher.designation = g('tc_designation').value;
  if(g('tc_currentStation')) r.teacher.currentStation = g('tc_currentStation').value;
  if(g('tc_countySubCounty')) r.teacher.countySubCounty = g('tc_countySubCounty').value;
  if(g('tc_newStation')) r.teacher.newStation = g('tc_newStation').value;
  if(g('tc_effectiveDate')) r.teacher.effectiveDate = g('tc_effectiveDate').value;
  r.checklist.forEach((c,i)=>{ if(g('tc_cl_remarks_'+i)) c.remarks = g('tc_cl_remarks_'+i).value; });
  if(g('tc_handedOverTo')) r.handover.handedOverTo = g('tc_handedOverTo').value;
  if(g('tc_designationTscNo')) r.handover.designationTscNo = g('tc_designationTscNo').value;
  if(g('tc_dateOfHandover')) r.handover.dateOfHandover = g('tc_dateOfHandover').value;
  if(g('tc_outstandingMatters')) r.handover.outstandingMatters = g('tc_outstandingMatters').value;
  if(g('tc_declDate')) r.declaration.date = g('tc_declDate').value;
  r.officers.forEach((o,i)=>{
    if(g('tc_off_name_'+i)) o.name = g('tc_off_name_'+i).value;
    if(g('tc_off_tscNo_'+i)) o.tscNo = g('tc_off_tscNo_'+i).value;
    if(g('tc_off_date_'+i)) o.date = g('tc_off_date_'+i).value;
    if(g('tc_off_stamped_'+i)) o.stamped = g('tc_off_stamped_'+i).checked;
    if(g('tc_off_clearance_'+i)) o.clearance = g('tc_off_clearance_'+i).value;
    if(g('tc_off_comment_'+i)) o.comment = g('tc_off_comment_'+i).value;
  });
  if(g('tc_headName')) r.certification.headName = g('tc_headName').value;
  if(g('tc_certDate')) r.certification.date = g('tc_certDate').value;
  if(g('tc_certStamped')) r.certification.stamped = g('tc_certStamped').checked;
}
function tcGoStep(i){ tcSyncFromDOM(); tcStep = i; render(); }
function tcSetChecklist(i, field, val){
  tcSyncFromDOM();
  tcCurrentRecord.checklist[i][field] = val;
  render();
}
function tcSigOrExisting(id, existing){ return isSigEmpty(id) ? existing : sigDataUrl(id); }
function tcClearSigField(id, path){
  clearSig(id);
  const parts = path.split('.');
  let obj = tcCurrentRecord;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = '';
  render();
}
function initTCSigPads(){
  if(!tcCurrentRecord) return;
  if(tcStep===3) initSigPad('tc_sig_decl');
  if(tcStep===4) TC_OFFICER_AREAS.forEach((a,i)=> initSigPad('tc_sig_off_'+i));
  if(tcStep===5) initSigPad('tc_sig_cert');
}
function tcSigNote(existing){
  return existing ? `<div style="font-size:11px; color:var(--ok); margin-top:4px;">✓ Signature on file — draw again below only to replace it.</div>` : '';
}

function renderTCForm(){
  const r = tcCurrentRecord;
  const ro = !canTCEdit();
  const roTeacherStep = role !== 'administrator';
  const stepperHtml = TC_STEPS.map((s,i)=>`<button class="btn-sm ${i===tcStep?'btn-primary':'btn-outline'}" style="flex-shrink:0;" onclick="tcGoStep(${i})">${i+1}. ${s}</button>`).join('');
  let body = '';
  if(tcStep===0){
    const t = r.teacher;
    body = `
    ${roTeacherStep ? `<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">🔒 Only the Administrator can initiate or edit teacher details. This step is locked for your role.</div>` : ''}
    <label>Full Name</label><input id="tc_fullName" type="text" value="${esc(t.fullName)}" ${roTeacherStep?'disabled':''}>
    <div class="grid2">
      <div><label>TSC Number</label><input id="tc_tscNumber" type="text" value="${esc(t.tscNumber)}" ${roTeacherStep?'disabled':''}></div>
      <div><label>ID / Passport No.</label><input id="tc_idPassport" type="text" value="${esc(t.idPassport)}" ${roTeacherStep?'disabled':''}></div>
    </div>
    <label>Designation / Grade</label><input id="tc_designation" type="text" value="${esc(t.designation)}" ${roTeacherStep?'disabled':''}>
    <label>Current Station / School</label><input id="tc_currentStation" type="text" value="${esc(t.currentStation)}" ${roTeacherStep?'disabled':''}>
    <label>County / Sub-County</label><input id="tc_countySubCounty" type="text" value="${esc(t.countySubCounty)}" ${roTeacherStep?'disabled':''}>
    <label>New Station / School</label><input id="tc_newStation" type="text" value="${esc(t.newStation)}" ${roTeacherStep?'disabled':''}>
    <label>Effective Date of Transfer</label><input id="tc_effectiveDate" type="date" value="${esc(t.effectiveDate)}" ${roTeacherStep?'disabled':''}>
    `;
  } else if(tcStep===1){
    body = r.checklist.map((c,i)=>`
      <div class="card" style="margin-bottom:8px;">
        <div style="font-weight:600; font-size:13px; margin-bottom:6px;">${i+1}. ${esc(c.item)}</div>
        <div class="row" style="margin-bottom:6px;">
          <button class="btn-sm ${c.cleared==='Yes'?'btn-primary':'btn-outline'}" ${ro?'disabled':''} onclick="tcSetChecklist(${i},'cleared','Yes')">Yes</button>
          <button class="btn-sm ${c.cleared==='No'?'btn-danger':'btn-outline'}" ${ro?'disabled':''} onclick="tcSetChecklist(${i},'cleared','No')">No</button>
        </div>
        <input id="tc_cl_remarks_${i}" type="text" placeholder="Remarks" value="${esc(c.remarks)}" ${ro?'disabled':''}>
      </div>`).join('');
  } else if(tcStep===2){
    const h = r.handover;
    body = `
    <label>Work handed over to</label><input id="tc_handedOverTo" type="text" value="${esc(h.handedOverTo)}" ${ro?'disabled':''}>
    <label>Designation / TSC No.</label><input id="tc_designationTscNo" type="text" value="${esc(h.designationTscNo)}" ${ro?'disabled':''}>
    <label>Date of handover</label><input id="tc_dateOfHandover" type="date" value="${esc(h.dateOfHandover)}" ${ro?'disabled':''}>
    <label>Outstanding matters, if any</label><textarea id="tc_outstandingMatters" ${ro?'disabled':''}>${esc(h.outstandingMatters)}</textarea>
    `;
  } else if(tcStep===3){
    body = `
    <p style="font-size:12.5px; color:var(--muted);">I confirm that I have handed over the school property, records, responsibilities and other items entrusted to me, except for any outstanding matters expressly indicated above.</p>
    <label>Teacher's Signature</label>
    <canvas id="tc_sig_decl" style="width:100%; height:130px; border:1.5px dashed var(--border); border-radius:10px; background:#fff; touch-action:none;"></canvas>
    ${tcSigNote(r.declaration.signature)}
    ${!ro ? `<div class="row" style="margin-top:6px;"><button class="btn-sm btn-outline" onclick="tcClearSigField('tc_sig_decl','declaration.signature')">Clear</button></div>` : ''}
    <label>Date</label><input id="tc_declDate" type="date" value="${esc(r.declaration.date)}" ${ro?'disabled':''}>
    `;
  } else if(tcStep===4){
    body = r.officers.map((o,i)=>{
      const clearance = o.clearance || "";
      const badgeClass = clearance==='Cleared for release' ? 'ok' : clearance==='Not cleared' ? 'danger' : 'warn';
      const badgeLabel = clearance || 'Pending';
      return `
      <div class="card" style="margin-bottom:10px;">
        <div class="row" style="justify-content:space-between; margin-bottom:6px;">
          <div style="font-weight:700; font-size:12.5px; color:var(--green);">${esc(o.area)}</div>
          <span class="badge ${badgeClass}">${esc(badgeLabel)}</span>
        </div>
        <label>Name</label><input id="tc_off_name_${i}" type="text" value="${esc(o.name)}" ${ro?'disabled':''}>
        <label>TSC No.</label><input id="tc_off_tscNo_${i}" type="text" value="${esc(o.tscNo||'')}" ${ro?'disabled':''}>
        <label>Clearance Status</label>
        <select id="tc_off_clearance_${i}" ${ro?'disabled':''} onchange="tcSyncFromDOM(); render();">
          <option value="" ${clearance===''?'selected':''}>— Pending —</option>
          <option value="Cleared for release" ${clearance==='Cleared for release'?'selected':''}>Cleared for release</option>
          <option value="Not cleared" ${clearance==='Not cleared'?'selected':''}>Not cleared</option>
        </select>
        <label>Comment</label>
        <textarea id="tc_off_comment_${i}" placeholder="Reason, outstanding item, or note (required if not cleared)" ${ro?'disabled':''}>${esc(o.comment||'')}</textarea>
        <label>Signature</label>
        <canvas id="tc_sig_off_${i}" style="width:100%; height:120px; border:1.5px dashed var(--border); border-radius:10px; background:#fff; touch-action:none;"></canvas>
        ${tcSigNote(o.signature)}
        ${!ro ? `<div class="row" style="margin-top:6px;"><button class="btn-sm btn-outline" onclick="tcClearSigField('tc_sig_off_${i}','officers.${i}.signature')">Clear</button></div>` : ''}
        <label>Date</label><input id="tc_off_date_${i}" type="date" value="${esc(o.date)}" ${ro?'disabled':''}>
        <div class="row" style="margin-top:8px; font-size:12.5px;">
          <input type="checkbox" id="tc_off_stamped_${i}" ${o.stamped?'checked':''} ${ro?'disabled':''}>
          <label for="tc_off_stamped_${i}" style="margin:0;">Official stamp applied</label>
        </div>
      </div>`;
    }).join('');
  } else if(tcStep===5){
    const c = r.certification;
    body = `
    <p style="font-size:12.5px; color:var(--muted);">I certify that the above teacher has completed the required station clearance and handover to the best of my knowledge, subject to any outstanding matter recorded on this form.</p>
    <label>Head of Institution — Name</label><input id="tc_headName" type="text" value="${esc(c.headName)}" ${ro?'disabled':''}>
    <label>Signature</label>
    <canvas id="tc_sig_cert" style="width:100%; height:130px; border:1.5px dashed var(--border); border-radius:10px; background:#fff; touch-action:none;"></canvas>
    ${tcSigNote(c.signature)}
    ${!ro ? `<div class="row" style="margin-top:6px;"><button class="btn-sm btn-outline" onclick="tcClearSigField('tc_sig_cert','certification.signature')">Clear</button></div>` : ''}
    <label>Date</label><input id="tc_certDate" type="date" value="${esc(c.date)}" ${ro?'disabled':''}>
    <div class="row" style="margin-top:8px; font-size:12.5px;">
      <input type="checkbox" id="tc_certStamped" ${c.stamped?'checked':''} ${ro?'disabled':''}>
      <label for="tc_certStamped" style="margin:0;">Official stamp applied</label>
    </div>
    `;
  }
  return `
    <div class="row" style="overflow-x:auto; margin-bottom:12px; flex-wrap:nowrap;">${stepperHtml}</div>
    <div class="card">${body}</div>
    <div class="row" style="margin-top:10px;">
      ${tcStep>0 ? `<button class="btn-outline" style="flex:1;" onclick="tcGoStep(${tcStep-1})">← Back</button>` : ''}
      ${tcStep<TC_STEPS.length-1 ? `<button class="btn-primary" style="flex:1;" onclick="tcGoStep(${tcStep+1})">Next →</button>` : (canTCEdit() ? `<button class="btn-primary" style="flex:1;" onclick="tcSaveRecord()">💾 Save Record</button>` : '')}
    </div>
    ${canTCEdit() ? `<button class="btn-outline" style="width:100%; margin-top:10px;" onclick="tcSaveAndExit()">💾 Save &amp; Back to Register</button>` : `<button class="btn-outline" style="width:100%; margin-top:10px;" onclick="setTab('register')">← Back to Register</button>`}
  `;
}
function tcFinalizeSignatures(){
  const r = tcCurrentRecord;
  r.declaration.signature = tcSigOrExisting('tc_sig_decl', r.declaration.signature);
  r.officers.forEach((o,i)=>{ o.signature = tcSigOrExisting('tc_sig_off_'+i, o.signature); });
  r.certification.signature = tcSigOrExisting('tc_sig_cert', r.certification.signature);
}
function tcSaveRecord(){
  if(!canTCEdit()){ toast('View only'); return; }
  tcSyncFromDOM();
  tcFinalizeSignatures();
  const r = tcCurrentRecord;
  if(!r.teacher.fullName){ toast("Enter the teacher's full name first"); tcStep = 0; render(); return; }
  r.status = tcComputeStatus(r);
  const ref = r.id ? db.collection('transfer_records').doc(r.id) : db.collection('transfer_records').doc();
  r.id = ref.id;
  ref.set(r).then(()=>{ toast('Clearance record saved'); }).catch(()=> toast('Save failed — check connection'));
}
function tcSaveAndExit(){
  if(!canTCEdit()){ setTab('register'); return; }
  tcSyncFromDOM();
  tcFinalizeSignatures();
  const r = tcCurrentRecord;
  r.status = tcComputeStatus(r);
  const ref = r.id ? db.collection('transfer_records').doc(r.id) : db.collection('transfer_records').doc();
  r.id = ref.id;
  ref.set(r).then(()=>{ toast('Draft saved'); }).catch(()=> toast('Save failed — check connection'));
  setTab('register');
}

function tcExportPDF(id){
  const r = STATE.transferRecords.find(x=>x.id===id);
  if(!r) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  let y = 40;
  try{ doc.addImage(SCHOOL_LOGO, 'PNG', pageW/2-20, y-28, 40, 40); }catch(e){}
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(27,67,50);
  doc.text('REPUBLIC OF KENYA', pageW/2, y+22, {align:'center'}); y+=40;
  doc.text('TEACHERS SERVICE COMMISSION', pageW/2, y, {align:'center'}); y+=16;
  doc.text('TEACHER TRANSFER CLEARANCE FORM', pageW/2, y, {align:'center'}); y+=14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(60,60,60);
  doc.text(STATE.settings.schoolName||"Sang'a Comprehensive School", pageW/2, y, {align:'center'}); y+=20;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0); doc.text('A. TEACHER DETAILS', 40, y); y+=6;
  const t = r.teacher;
  doc.autoTable({
    startY: y, theme:'grid', margin:{left:40,right:40}, styles:{fontSize:9, cellPadding:5},
    body: [
      ['Full Name', t.fullName||''],
      ['TSC Number', t.tscNumber||''],
      ['ID/Passport No.', t.idPassport||''],
      ['Designation/Grade', t.designation||''],
      ['Current Station/School', t.currentStation||''],
      ['County / Sub-County', t.countySubCounty||''],
      ['New Station/School', t.newStation||''],
      ['Effective Date of Transfer', t.effectiveDate||''],
    ],
    columnStyles:{0:{cellWidth:170, fontStyle:'bold'}}
  });
  y = doc.lastAutoTable.finalY + 16;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('B. CLEARANCE CHECKLIST', 40, y); y+=6;
  doc.autoTable({
    startY:y, theme:'grid', margin:{left:40,right:40}, styles:{fontSize:8.5, cellPadding:4},
    head:[['#','Item / Responsibility','Cleared','Remarks']],
    body: r.checklist.map((c,i)=>[i+1, c.item, c.cleared||'—', c.remarks||'']),
    headStyles:{fillColor:[27,67,50]}
  });
  y = doc.lastAutoTable.finalY + 16;

  if(y > 650){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('C. HANDOVER DETAILS', 40, y); y+=6;
  const h = r.handover;
  doc.autoTable({
    startY:y, theme:'grid', margin:{left:40,right:40}, styles:{fontSize:9, cellPadding:5},
    body: [
      ['Work handed over to', h.handedOverTo||''],
      ['Designation / TSC No.', h.designationTscNo||''],
      ['Date of handover', h.dateOfHandover||''],
      ['Outstanding matters', h.outstandingMatters||'None'],
    ],
    columnStyles:{0:{cellWidth:170, fontStyle:'bold'}}
  });
  y = doc.lastAutoTable.finalY + 16;

  if(y > 600){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('D. DECLARATION BY THE TRANSFERRING TEACHER', 40, y); y+=14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('I confirm that I have handed over the school property, records, responsibilities and', 40, y); y+=12;
  doc.text('other items entrusted to me, except for any outstanding matters expressly indicated above.', 40, y); y+=14;
  if(r.declaration.signature){
    try{ doc.addImage(r.declaration.signature, 'PNG', 40, y, 140, 50); }catch(e){}
  }
  doc.text('Date: ' + (r.declaration.date||'—'), 220, y+30);
  y += 65;

  if(y > 560){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('E. CLEARANCE BY RESPONSIBLE OFFICERS', 40, y); y+=10;
  r.officers.filter(o=> o.name || o.tscNo || o.signature || o.date || o.clearance || o.comment).forEach(o=>{
    if(y > 690){ doc.addPage(); y=40; }
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.text(o.area, 40, y); y+=4;
    if(o.signature){ try{ doc.addImage(o.signature,'PNG', 40, y+4, 110, 38); }catch(e){} }
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text('Name: ' + (o.name||'—'), 165, y+12);
    doc.text('TSC No.: ' + (o.tscNo||'—'), 165, y+24);
    doc.text('Date: ' + (o.date||'—'), 165, y+36);
    doc.text('Stamp: ' + (o.stamped?'Applied':'—'), 350, y+36);
    doc.setFont('helvetica','bold');
    doc.text('Status: ' + (o.clearance||'Pending'), 165, y+48);
    doc.setFont('helvetica','normal');
    y += 60;
    if(o.comment){
      const commentLines = doc.splitTextToSize('Comment: ' + o.comment, 480);
      commentLines.forEach(line=>{
        if(y > 700){ doc.addPage(); y=40; }
        doc.text(line, 40, y);
        y += 11;
      });
      y += 4;
    }
  });

  if(y > 620){ doc.addPage(); y=40; }
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text("F. HEAD OF INSTITUTION'S FINAL CERTIFICATION", 40, y); y+=14;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('I certify that the above teacher has completed the required station clearance and', 40, y); y+=12;
  doc.text('handover to the best of my knowledge, subject to any outstanding matter recorded above.', 40, y); y+=14;
  doc.text('Name: ' + (r.certification.headName||'—'), 40, y); y+=6;
  if(r.certification.signature){ try{ doc.addImage(r.certification.signature,'PNG', 40, y+6, 140, 50); }catch(e){} }
  doc.text('Date: ' + (r.certification.date||'—'), 220, y+36);
  doc.text('Stamp: ' + (r.certification.stamped?'Applied':'—'), 350, y+36);

  const safeName = (t.fullName||'teacher').replace(/[^a-z0-9]/gi,'_');
  doc.save(`transfer-clearance-${safeName}.pdf`);
}
function tcExportBulkPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(27,67,50);
  doc.text(`${STATE.settings.schoolName||"Sang'a Comprehensive School"} — Teacher Transfer Clearance Register`, 40, 32);
  try{ doc.addImage(SCHOOL_LOGO, 'PNG', doc.internal.pageSize.getWidth()-70, 10, 36, 36); }catch(e){}
  doc.autoTable({
    startY: 50, theme:'grid', styles:{fontSize:8.5, cellPadding:4},
    head:[['Full Name','TSC No.','Current Station','New Station','Effective Date','Status']],
    body: STATE.transferRecords.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(r=>{
      const st = tcComputeStatus(r);
      return [
        r.teacher.fullName||'', r.teacher.tscNumber||'', r.teacher.currentStation||'',
        r.teacher.newStation||'', r.teacher.effectiveDate||'',
        st==='done'?'Completed':st==='progress'?'In progress':'Draft'
      ];
    }),
    headStyles:{fillColor:[27,67,50]}
  });
  doc.save(`sanga-transfer-clearance-register-${todayISO()}.pdf`);
}

  authDomain: "teacher-clearance.firebaseapp.com",
  projectId: "teacher-clearance",
  storageBucket: "teacher-clearance.firebasestorage.app",
  messagingSenderId: "19256328327",
  appId: "1:19256328327:web:1fb02191bd2526d0723822"
};
function renderTCSettings(){
  return `
  <h2 class="section">Import Legacy Data</h2>
  <div class="card">
    <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">
      Copies every clearance record from the original standalone Teacher Transfer Clearance app (project <code>teacher-clearance</code>) into this hub. Safe to run more than once — already-imported records are skipped.
    </div>
    <button class="btn-primary" onclick="importLegacyTransferData()">Import from old Transfer Clearance app</button>
    <div id="tcImportStatus" style="font-size:12px; color:var(--muted); margin-top:8px;"></div>
  </div>`;
}
function importLegacyTransferData(){
  if(!confirm('This copies all records from the old Teacher Transfer Clearance app into this hub. Continue?')) return;
  const status = document.getElementById('tcImportStatus');
  if(status) status.textContent = 'Connecting to old project…';
  legacyGetCollection('legacyTransfer', LEGACY_TRANSFER_CONFIG, 'transferClearances')
    .then(snap=>{
      const existingLegacyIds = new Set(STATE.transferRecords.map(x=>x.legacyId).filter(Boolean));
      const toImport = snap.docs.filter(d=>!existingLegacyIds.has(d.id));
      if(!toImport.length){ if(status) status.textContent='Nothing new to import — already up to date.'; return; }
      if(status) status.textContent = `Importing ${toImport.length} record(s)…`;
      Promise.all(toImport.map(d=> db.collection('transfer_records').add({...d.data(), legacyId:d.id})))
        .then(()=>{ if(status) status.textContent = `Imported ${toImport.length} clearance record(s).`; toast('Import complete'); })
        .catch(()=>{ if(status) status.textContent = 'Import failed partway — check connection and retry.'; });
    })
    .catch(err=>{ console.error(err); if(status) status.textContent = 'Could not read old project: '+(err.code||err.message||err)+'. If this says permission-denied, the old project Firestore rules block outside reads. If it says auth/admin-restricted-operation or operation-not-allowed, enable Anonymous sign-in in that old project Firebase Console under Authentication, Sign-in method.'; });
}
